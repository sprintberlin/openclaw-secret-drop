[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-secret-drop"
version = "0.1.0"
description = "Silent one-time secret link ingest for OpenClaw messenger-only agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cleo Winter" }]
dependencies = ["cryptography>=42.0.0"]
keywords = ["openclaw", "secrets", "password-pusher", "snappwd", "telegram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
secret-drop = "secret_drop.cli:main"

[project.urls]
Homepage = "https://github.com/sprintberlin/openclaw-secret-drop"
Issues = "https://github.com/sprintberlin/openclaw-secret-drop/issues"

[tool.setuptools.packages.find]
include = ["secret_drop*"]
